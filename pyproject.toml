[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pybella"
version = "0.50.1"

dependencies = [
    "dask",
    "dill",
    "h5py",
    "matplotlib",
    "numba",
    "numpy",
    "PyYAML",
    "scipy",
    "termcolor"
]

[project.optional-dependencies]
jax = ["jax>=0.4.35"]
# GPU clusters: jax's bundled CUDA wheels (hardware-agnostic code; only the
# install extra differs). Pin the cluster env to the jax version CI last
# passed with.
jax-cuda = ["jax[cuda12]>=0.4.35"]

[project.scripts]
pybella = "pybella.__main__:main"

# Change Log
[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.rst"
underlines = ["-", "^"]

[[tool.towncrier.type]]
directory = "infrastructure"
name = "Infrastructure"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Improved Documentation"
showcontent = true