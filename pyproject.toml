[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pybella"
version = "0.51.0"

dependencies = [
    "dask",
    "dill",
    "h5py",
    "matplotlib",
    "numba",
    "numpy",
    "PyYAML",
    "scipy",
    "termcolor"
]

[project.optional-dependencies]
# ETPF data assimilation (optimal-transport solver); the deterministic solver
# and the LETKF never need it.
da = ["POT"]
# NEDAS ensemble-DA engine (interfaces/nedas adapter). Pinned: the v1.2.0
# model/dataset registries are hardcoded and the API churned v1.0->v1.2.
# Serial runs need no MPI; install mpi4py separately for mpirun ensembles.
nedas = ["NEDAS==1.2.0"]
jax = ["jax>=0.4.35"]
# GPU clusters: jax's bundled CUDA wheels (hardware-agnostic code; only the
# install extra differs). Pin the cluster env to the jax version CI last
# passed with.
jax-cuda = ["jax[cuda12]>=0.4.35"]

[project.scripts]
pybella = "pybella.__main__:main"

# Change Log
[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.rst"
underlines = ["-", "^"]

[[tool.towncrier.type]]
directory = "infrastructure"
name = "Infrastructure"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Improved Documentation"
showcontent = true