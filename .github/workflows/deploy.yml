name: deploy

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Skip setup-python if running under act
      - name: Set up Python (GitHub only)
        if: ${{ !env.ACT }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Show system Python version when running under act
      - name: Use system Python (act)
        if: ${{ env.ACT }}
        run: |
          echo "Using system Python"
          which python
          python --version

      - name: Install dependencies
        run: |
          pip install -r dev-requirements.txt
          pip install .

      - name: Run tests without coverage
        run: |
          # pytest --cov=src --cov-report=xml --cov-report=html --cov-report=term
          pytest ./test_scripts/test_blending.py
          pytest ./test_scripts/test_flow_solver.py
          pytest ./test_scripts/test_3d_elliptic_oracle.py
          pytest ./test_scripts/test_igw_analytic.py
          pytest ./test_scripts/test_3d_coriolis_oracle.py
          pytest ./test_scripts/test_axes.py
          pytest ./test_scripts/test_permutation_oracle.py
          pytest ./test_scripts/test_zvert_smoke.py
          pytest ./test_scripts/test_terrain_transform.py
          pytest ./test_scripts/test_terrain_identity_oracle.py
          pytest ./test_scripts/test_terrain_elliptic_oracle.py
          pytest ./test_scripts/test_terrain_2d_oracle.py
          pytest ./test_scripts/test_terrain_resting_atmosphere.py
          pytest ./test_scripts/test_agnesi_smoke.py
          pytest ./test_scripts/test_agnesi_analytic.py
          pytest ./test_scripts/test_agnesi_2d_equivalence.py
          pytest ./test_scripts/test_schaer_smoke.py
          pytest ./test_scripts/test_schaer_analytic.py
          # the test_jax_* scripts run in the jax-equivalence job (jax
          # installed there); without jax they collect 0 tests and
          # pytest >= 9 fails a no-tests-collected run with exit code 5

      # - name: Upload coverage HTML report
      #   if: ${{ !env.ACT }}
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: coverage-html
      #     path: htmlcov/

      - name: Upload test plots and logs
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: test-outputs
          path: |
            outputs/**/*.png
            logs/**/*.log
            !outputs/**/*.dat
            !outputs/**/*.h5

  # JAX backend golden-master equivalence (dev_notes/jax_migration.md).
  # Python 3.12: recent jax dropped 3.10; jax deliberately unpinned so this
  # job doubles as an early warning when a new jax release breaks the port.
  jax-equivalence:
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r dev-requirements.txt
          pip install ".[jax]"

      - name: Run JAX operator equivalence
        run: |
          pytest ./test_scripts/test_jax_operator_equivalence.py
          pytest ./test_scripts/test_jax_elliptic_equivalence.py
          pytest ./test_scripts/test_jax_advection_equivalence.py
          pytest ./test_scripts/test_jax_boundary_equivalence.py
          pytest ./test_scripts/test_jax_device_equivalence.py

      - name: Run full regression cases on the JAX backend
        run: |
          pytest ./test_scripts/test_jax_fullrun.py
          pytest ./test_scripts/test_jax_device_fullrun.py

