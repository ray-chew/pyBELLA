# NEDAS==1.2.0 run config: travelling-vortex OSSE through NEDAS (Phase N2
# parity target — pinned native RMSE tables in dev_notes/da_reinstatement.md).
# Launch (after pip install "pybella[nedas]"):
#   python -c "import pybella.interfaces.nedas as pn; pn.register();
#              from NEDAS import get_scheme; get_scheme(config_file='run_scripts/nedas_tv_osse.yml')()"
# Unset keys fall back to NEDAS/config/default.yml.
work_dir: outputs/nedas_tv_osse

io_mode: online          # in-memory ModelState coupling; single process
job_submit:
  host: local
  parallel_mode: serial

nproc: 1
nens: 10                 # K=10, as the native TV OSSE

run_preproc: True
run_forecast: True
run_analysis: True
run_postproc: True
run_diagnose: False
interactive: False

# Convention: 1 NEDAS "hour" == 1 pyBELLA nondimensional time unit.
# Native da_times = 0.25, 0.50, ..., 3.00  ->  12 cycles of 0.25.
time_start: 2001-01-01T00:00:00Z
time_end: 2001-01-01T03:00:00Z
time_analysis_start: 2001-01-01T00:15:00Z
time_analysis_end: 2001-01-01T03:00:00Z
cycle_period: 0.25       # RISK 5 in dev_notes: verify fractional-hour cycles early
obs_time_steps: [0]
state_time_steps: [0]

grid_def:
  type: pybella          # use the model (inner cell-centre) grid directly

model_def:
  pybella:
    ic: test_travelling_vortex
    random_seed: 888
    ens_init_dir: '{work_dir}/init_ens'
    truth_dir: '{work_dir}/truth'

state_def:
- name: momentum         # (rhou, rhov) vector pair — the fields the native rloc updates
  model_src: pybella
  var_type: field
  err_type: normal

obs_def:
- name: momentum
  dataset_src: pybella
  model_src: pybella
  err:
    type: normal
    std: 0.0             # obs_file mode: err std comes from the native obs H5 (VarCov 5%)
  hroi: 0.086            # nondim; ~5.5 cells * dx(=1/64), matched to native 11x11 rloc support
  vroi: 1000
  troi: 24

dataset_def:
  pybella:
    model_src: pybella
    obs_file: outputs/output_travelling_vortex/tv_obs_64.h5   # native osse_mwr2022.py obs
    obs_window_min: -0.25
    obs_window_max: 0

perturb:

scheme: filter
niter: 1
resolution_level: [0]
character_length: [16]
localize_scale_fac: [1]
obs_err_scale_fac: [1]

assimilator_def:
  type: ETKF             # batch/local analysis — the LETKF-like engine

updator_def:
  type: additive

inflation_def:
  type: post,multiplicative
  adaptive: False
  coef: 1.0              # native TV OSSE ran inflation 1.0

localization_def:
  horizontal:
    type: gaspari_cohn   # vs native truncated Gaussian: statistical parity only
  vertical:
    type: gaspari_cohn
  temporal:
    type: exponential

diag:
